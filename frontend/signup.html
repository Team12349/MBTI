<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBTI</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="icon" href="favicon.svg" />
  </head>
  <body>
    <header id="header">
      <a href="index.html" class="brand">
        <img src="favicon.svg" alt="MBTI Logo" class="logo" />
        <p>MBTI</p>
      </a>

      <div class="header-list">
        <ul>
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="advice.html">Advice</a></li>
          <li><a href="team.html">Our Team</a></li>
        </ul>
      </div>

      <div class="auth-buttons">
        <a href="login.html" class="login" id="loginBtn">Log in</a>
        <a href="signup.html" class="login" id="signupBtn">Sign up</a>
      </div>
    </header>

    <div class="sign-up">
      <h1>Get Started</h1>
      <p>Welcome to MBTI - Let`s get started</p>

      <form id="form" action="http://localhost:3000/register" method="POST">
        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="username" placeholder="Enter Full Name" />
          <small class="error"></small>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter Email" />
          <small class="error"></small>
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" />
          <small class="error"></small>
        </div>

        <button type="submit" id="submitBtn">Sign up</button>
      </form>
      <p>Already have an account?<a href="login.html">Log in</a></p>
    </div>

    <footer>
      <div class="footer-brand">
        <a href="index.html"><img src="favicon.svg" alt="MBTI Logo" class="logo" /></a>
        <a href="index.html">MBTI</a>
      </div>
      <span>&copy; 2026 limit404.</span>
      <div class="footer-links">
        <div class="social-media">
          <span class="social-media-title">Github</span>
          <a href="https://github.com/Team12349/MBTI" target="_blank" class="github-link">
            <img src="images/github.svg" class="github-icon" />
          </a>
        </div>
      </div>
    </footer>

    <script src="js/auth-ui.js" type="module"></script>
    <script src="js/signup.js" type="module"></script>
  </body>
</html>
