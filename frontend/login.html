<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBTI</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="icon" href="favicon.svg" />
  </head>
  <body>
    <header id="header">
      <a href="index.html" class="brand">
        <img src="favicon.svg" alt="MBTI Logo" class="logo" />
        <p>MBTI</p>
      </a>

      <div class="header-list">
        <ul>
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="advice.html">Advice</a></li>
          <li><a href="team.html">Our Team</a></li>
        </ul>
      </div>

      <div class="auth-buttons">
        <a href="login.html" class="login">Log in</a>
        <a href="signup.html" class="login">Sign up</a>
      </div>
    </header>
    <div class="log-in">
      <h1>Welcome back</h1>
      <p>Welcome to MBTI - Let`s get you in again</p>

      <form id="form" action="http://localhost:3000/login" method="POST">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter Email" />
          <small class="error"></small>
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" />
          <small class="error"></small>
        </div>

        <button type="submit">Log in</button>
      </form>
      <p>Don`t have an account?<a href="signup.html">Sign up</a></p>
    </div>
    <hr />
    <footer>
      <div class="footer-brand">
        <a href="index.html"><img src="favicon.svg" alt="MBTI Logo" class="logo" /></a>
        <a href="index.html">MBTI</a>
      </div>
      <span>&copy; 2026 limit404.</span>
    </footer>

    <script src="js/login.js"></script>
  </body>
</html>
